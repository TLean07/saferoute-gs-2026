spring.datasource.url=jdbc:h2:mem:saferoute;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-demo.sql
spring.sql.init.data-locations=classpath:data-demo.sql
saferoute.admin-key=demo-saferoute-local
